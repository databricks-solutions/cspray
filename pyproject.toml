[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cspray"
version = "1.1.1"
authors = [{name = "Peter Hawkins", email = "peter.hawkins@databricks.com"}]
description = "Cell SPRAY"
dependencies = [
   "anndata>=0.11.3",
   "scanpy>=1.11.0",
   "bbknn>=1.5",
   "pyspark",
   "pyarrow>=18",
   "numpy",
   "scipy>1.15",
   "pooch",
   "pybiomart",
   "cellxgene_census",
   "gget"
]

[project.optional-dependencies]
# pytest only — safe on Databricks classic (cluster already has Spark/Delta).
test = [
    "pytest",
]
# Laptop / OSS Spark. Do not install this extra on a Databricks cluster.
# Spark 4 + Delta 4
local = [
    "pyspark>=4.0.1,<4.3",
    "delta-spark>=4,<5",
    "pyarrow>=18",
    "setuptools",  # pyspark.ml still imports distutils; gone in Python 3.12
]

[tool.setuptools]
packages = ["cspray"]
package-dir = {"" = "src"}